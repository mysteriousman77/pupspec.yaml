name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name lesehantv --org com.lesehantv .

      - name: Patch AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' $M
          sed -i 's|android:label="[^"]*"|android:label="LesehanTV"|' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application#' $M
          sed -i 's#</application>#<receiver android:name=".NotifReceiver" android:exported="false"/>\n        <receiver android:name=".BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver>\n    </application>#' $M

      # kode native: volume & kecerahan asli perangkat
      - name: Write native MainActivity
        run: |
          D=android/app/src/main/kotlin/com/lesehantv/lesehantv
          mkdir -p $D
          find android/app/src/main -name 'MainActivity.*' -delete
          cat > $D/MainActivity.kt <<'KOT'
          package com.lesehantv.lesehantv

          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager
          import android.content.pm.PackageManager
          import android.os.Build
          import android.provider.Settings
          import android.util.Base64
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var pending: MethodChannel.Result? = null
              private var pendingText: String? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "lesehan/native")
                      .setMethodCallHandler { call, result ->
                          val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          val mx = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                          when (call.method) {
                              "getVolume" -> result.success(
                                  if (mx > 0) am.getStreamVolume(AudioManager.STREAM_MUSIC).toDouble() / mx else 0.0)
                              "setVolume" -> {
                                  val v = (call.arguments as Number).toDouble()
                                  am.setStreamVolume(AudioManager.STREAM_MUSIC, Math.round(v * mx).toInt(), 0)
                                  result.success(null)
                              }
                              "getBrightness" -> {
                                  val b = window.attributes.screenBrightness
                                  if (b >= 0) {
                                      result.success(b.toDouble())
                                  } else {
                                      val s = try {
                                          Settings.System.getInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS)
                                      } catch (e: Exception) { 128 }
                                      result.success(s / 255.0)
                                  }
                              }
                              "setBrightness" -> {
                                  val v = (call.arguments as Number).toDouble()
                                  val lp = window.attributes
                                  lp.screenBrightness = if (v < 0) WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE
                                      else v.coerceIn(0.01, 1.0).toFloat()
                                  window.attributes = lp
                                  result.success(null)
                              }
                              "setNotif" -> {
                                  val on = call.argument<Boolean>("on") ?: false
                                  val ed = Notif.prefs(this).edit().putBoolean("on", on)
                                  call.argument<String>("api")?.let { ed.putString("api", it) }
                                  call.argument<String>("key")?.let { ed.putString("key", it) }
                                  ed.apply()
                                  if (on) {
                                      if (Build.VERSION.SDK_INT >= 33 &&
                                          checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                                          requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 7003)
                                      }
                                      Notif.schedule(this)
                                      val ctx = applicationContext
                                      Thread { try { Notif.check(ctx, false) } catch (e: Exception) {} }.start()
                                  } else {
                                      Notif.cancel(this)
                                  }
                                  result.success(true)
                              }
                              "saveFile" -> {
                                  pending = result
                                  pendingText = call.argument<String>("b64")
                                  val i = Intent(Intent.ACTION_CREATE_DOCUMENT)
                                  i.addCategory(Intent.CATEGORY_OPENABLE)
                                  i.type = "application/octet-stream"
                                  i.putExtra(Intent.EXTRA_TITLE, call.argument<String>("name"))
                                  startActivityForResult(i, 7001)
                              }
                              "pickFile" -> {
                                  pending = result
                                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                                  i.addCategory(Intent.CATEGORY_OPENABLE)
                                  i.type = "*/*"
                                  startActivityForResult(i, 7002)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != 7001 && requestCode != 7002) return
                  val r = pending
                  pending = null
                  val uri = data?.data
                  if (resultCode != RESULT_OK || uri == null) {
                      if (requestCode == 7001) r?.success(false) else r?.success(null)
                      return
                  }
                  try {
                      if (requestCode == 7001) {
                          contentResolver.openOutputStream(uri)?.use {
                              it.write(Base64.decode(pendingText ?: "", Base64.DEFAULT))
                          }
                          r?.success(true)
                      } else {
                          val txt = contentResolver.openInputStream(uri)?.use {
                              Base64.encodeToString(it.readBytes(), Base64.NO_WRAP)
                          }
                          r?.success(txt)
                      }
                  } catch (e: Exception) {
                      if (requestCode == 7001) r?.success(false) else r?.success(null)
                  }
              }
          }
          KOT
          cat > $D/Notif.kt <<'KOT2'
          package com.lesehantv.lesehantv

          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL
          import javax.crypto.Mac
          import javax.crypto.spec.SecretKeySpec

          object Notif {
              private const val CH = "baru"
              private const val EVERY = 30 * 60 * 1000L

              fun prefs(c: Context) = c.getSharedPreferences("lesehan_notif", Context.MODE_PRIVATE)

              private fun pi(c: Context): PendingIntent =
                  PendingIntent.getBroadcast(c, 1, Intent(c, NotifReceiver::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)

              fun schedule(c: Context) {
                  val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val t = System.currentTimeMillis() + EVERY
                  if (Build.VERSION.SDK_INT >= 23) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi(c))
                  else am.set(AlarmManager.RTC_WAKEUP, t, pi(c))
              }

              fun cancel(c: Context) {
                  val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  am.cancel(pi(c))
              }

              private fun fetch(c: Context): String? {
                  val p = prefs(c)
                  val base = p.getString("api", "") ?: ""
                  val key = p.getString("key", "") ?: ""
                  if (base.isEmpty()) return null
                  val ts = System.currentTimeMillis() / 1000
                  val mac = Mac.getInstance("HmacSHA256")
                  mac.init(SecretKeySpec(key.toByteArray(), "HmacSHA256"))
                  val hex = mac.doFinal("$ts|list".toByteArray()).joinToString("") { "%02x".format(it) }.substring(0, 20)
                  val con = URL("$base?k=$ts.$hex").openConnection() as HttpURLConnection
                  con.connectTimeout = 8000
                  con.readTimeout = 8000
                  con.instanceFollowRedirects = true
                  return try {
                      if (con.responseCode != 200) null else con.inputStream.bufferedReader().readText()
                  } finally {
                      con.disconnect()
                  }
              }

              fun check(c: Context, notify: Boolean) {
                  val body = fetch(c) ?: return
                  val arr = JSONArray(body)
                  val p = prefs(c)
                  val seen = HashSet<String>(p.getStringSet("seen", emptySet()) ?: emptySet())
                  val first = seen.isEmpty()
                  val fresh = LinkedHashMap<String, Int>()
                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      val t = o.optString("judul").trim()
                      if (t.isEmpty()) continue
                      val id = t.lowercase() + "|" + o.optString("eps").trim()
                      if (seen.add(id)) fresh[t] = (fresh[t] ?: 0) + 1
                  }
                  if (fresh.isEmpty()) return
                  p.edit().putStringSet("seen", seen).apply()
                  if (notify && !first) show(c, fresh)
              }

              private fun show(c: Context, fresh: Map<String, Int>) {
                  val nm = c.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(NotificationChannel(CH, "Judul baru", NotificationManager.IMPORTANCE_DEFAULT))
                  }
                  val names = fresh.keys.toList()
                  val text = if (names.size == 1) {
                      val n = fresh[names[0]] ?: 1
                      if (n > 1) "${names[0]} (+$n episode)" else names[0]
                  } else {
                      names.take(3).joinToString(", ") + if (names.size > 3) " dan ${names.size - 3} lainnya" else ""
                  }
                  val open = c.packageManager.getLaunchIntentForPackage(c.packageName)
                  val pend = PendingIntent.getActivity(c, 2, open,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(c, CH) else Notification.Builder(c)
                  b.setSmallIcon(c.applicationInfo.icon)
                      .setContentTitle("Baru di LesehanTV")
                      .setContentText(text)
                      .setStyle(Notification.BigTextStyle().bigText(text))
                      .setContentIntent(pend)
                      .setAutoCancel(true)
                  nm.notify(2001, b.build())
              }
          }

          class NotifReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent?) {
                  if (!Notif.prefs(c).getBoolean("on", false)) return
                  Notif.schedule(c)
                  val pr = goAsync()
                  val ctx = c.applicationContext
                  Thread {
                      try { Notif.check(ctx, true) } catch (e: Exception) {} finally { pr.finish() }
                  }.start()
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent?) {
                  if (Notif.prefs(c).getBoolean("on", false)) Notif.schedule(c)
              }
          }
          KOT2

      # latar peluncuran hitam (sebelum splash.mp4 tampil)
      - name: Latar peluncuran hitam
        run: |
          R=android/app/src/main/res
          for d in drawable drawable-v21; do
            mkdir -p $R/$d
            cat > $R/$d/launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item>
              <shape android:shape="rectangle">
                <solid android:color="#FF000000"/>
              </shape>
            </item>
          </layer-list>
          XML
          done
          mkdir -p $R/values-v28 $R/values-night-v28 $R/values-v31
          cat > $R/values-v28/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
              <item name="android:windowBackground">@drawable/launch_background</item>
              <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
            </style>
            <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
              <item name="android:windowBackground">?android:colorBackground</item>
              <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
            </style>
          </resources>
          XML
          cat > $R/values-night-v28/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
              <item name="android:windowBackground">@drawable/launch_background</item>
              <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
            </style>
            <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
              <item name="android:windowBackground">?android:colorBackground</item>
              <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
            </style>
          </resources>
          XML
          cat > $R/values-v31/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
              <item name="android:windowBackground">@drawable/launch_background</item>
              <item name="android:windowSplashScreenBackground">#000000</item>
              <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
            </style>
          </resources>
          XML

      # daftarkan folder assets/ di pubspec (jika belum)
      - name: Daftarkan assets
        run: |
          grep -q "assets:" pubspec.yaml || sed -i 's|^  uses-material-design: true|  uses-material-design: true\n  assets:\n    - assets/|' pubspec.yaml

      # ikon aplikasi dari assets/logo_icon.jpg
      - name: Pasang ikon aplikasi
        run: |
          if [ -f assets/logo_icon.jpg ]; then
            command -v convert >/dev/null || sudo apt-get install -y imagemagick
            R=android/app/src/main/res
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              IFS=: read n a b <<< "$d"
              i=$((b * 66 / 100))
              mkdir -p $R/mipmap-$n
              convert assets/logo_icon.jpg -resize ${a}x${a} $R/mipmap-$n/ic_launcher.png
              convert assets/logo_icon.jpg -resize ${i}x${i} -background '#0B2038' -gravity center -extent ${b}x${b} $R/mipmap-$n/ic_launcher_foreground.png
            done
            mkdir -p $R/mipmap-anydpi-v26 $R/values
            cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
            echo '<resources><color name="ic_launcher_background">#0B2038</color></resources>' > $R/values/ic_launcher_background.xml
          fi

      # paket crypto (token API) dan share_plus (bagikan rekap)
      - run: flutter pub add crypto share_plus:^10.1.4

      - run: flutter pub get

      - run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --build-number=${{ github.run_number }}

      # tanda tangan dengan kunci tetap (secret KEYSTORE_B64) supaya APK baru bisa
      # menimpa/update APK lama tanpa uninstall
      - name: Tanda tangani APK
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
            SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            AS=$(ls $SDK/build-tools/*/apksigner | sort -V | tail -1)
            "$AS" sign --ks "$RUNNER_TEMP/release.p12" --ks-pass pass:lesehantv --key-pass pass:lesehantv --ks-key-alias lesehantv --out "$RUNNER_TEMP/signed.apk" "$APK"
            "$AS" verify "$RUNNER_TEMP/signed.apk"
            cp "$RUNNER_TEMP/signed.apk" "$APK"
          else
            echo "KEYSTORE_B64 belum diisi: APK memakai kunci acak (update harus uninstall dulu)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lesehantv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
